name: SpotKick CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: spotkick-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check scanner positive control and scan history plus working tree
        run: node scripts/scan-secrets.mjs
      - name: Validate workflow syntax
        run: docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/ci.yml
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      kafka:
        image: apache/kafka:4.1.0
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports: ['9092:9092']
        options: --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" --health-interval 10s --health-timeout 10s --health-retries 12
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: spotkick, POSTGRES_USER: spotkick, POSTGRES_PASSWORD: spotkick}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U spotkick" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SPOTKICK_KAFKA_TEST_BROKERS: localhost:9092
      DATABASE_URL: postgres://spotkick:spotkick@localhost:5432/spotkick
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      BOT_AFTER_MS: 500
      RESULT_MS: 150
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:contract
      - run: pnpm typecheck
      - run: pnpm test:integration
      - run: pnpm test:mutations
      - run: pnpm build
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - name: Start production apps
        run: |
          node apps/api/dist/main.js > /tmp/spotkick-api.log 2>&1 &
          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          PORT=3000 HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js > /tmp/spotkick-web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health && curl -fsS http://localhost:3000 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/spotkick-api.log /tmp/spotkick-web.log
          exit 1
      - run: pnpm test:e2e
      - name: Build Compose targets
        run: docker compose build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
            /tmp/spotkick-api.log
            /tmp/spotkick-web.log

  publish-api:
    needs: [verify, secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/codex/spotkick-wallet' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: spotkick_image_test, POSTGRES_USER: spotkick, POSTGRES_PASSWORD: spotkick}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U spotkick" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API commit image for the NAS (no deployment)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/danimagnum/spotkick-api:sha-${{ github.sha }}
          provenance: false
          sbom: false
          outputs: type=image,compression=gzip,force-compression=true,oci-mediatypes=false
          labels: |
            org.opencontainers.image.source=https://github.com/Danimagnum/spotkick
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spotkick-api
          cache-to: type=gha,mode=max,scope=spotkick-api
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/danimagnum/spotkick-api@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Docker gzip manifest, architecture and standalone image
        env:
          IMAGE: ghcr.io/danimagnum/spotkick-api:sha-${{ github.sha }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > /tmp/spotkick-manifest.json
          node -e "const m=require('/tmp/spotkick-manifest.json'); if(m.mediaType!=='application/vnd.docker.distribution.manifest.v2+json'||!m.layers?.every(l=>l.mediaType==='application/vnd.docker.image.rootfs.diff.tar.gzip')) process.exit(1)"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
          docker run -d --name spotkick-image-smoke --network host --read-only --tmpfs /tmp --env PLATFORM_MODE=false --env CORE_URL=http://127.0.0.1:9 --env PORT=3001 --env DATABASE_URL=postgres://spotkick:spotkick@127.0.0.1:5432/spotkick_image_test --env REDIS_URL=redis://127.0.0.1:6379 "$IMAGE"
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3001/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health/live
          curl -fsS http://127.0.0.1:3001/health/ready
          curl -fsS http://127.0.0.1:3001/mode | node -e "let s='';process.stdin.on('data',b=>s+=b).on('end',()=>{if(JSON.parse(s).mode!=='demo')process.exit(1)})"
          curl -fsS http://127.0.0.1:3001/metrics | grep -q spotkick_resolution_duration_seconds_count
          docker stop --time 30 spotkick-image-smoke
      - name: Image smoke failure logs
        if: failure()
        run: docker logs spotkick-image-smoke || true
