# Standalone file: does not require Compose's newer !override feature.
# Build/import the images on the workstation before starting on the NAS.
services:
  postgres:
    image: postgres:17-alpine
    network_mode: service:redis
    command: [postgres, -c, listen_addresses=127.0.0.1]
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotkick
      POSTGRES_USER: spotkick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, spotkick]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --bind, 127.0.0.1, --appendonly, 'yes']
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3301}:3001'
      - '127.0.0.1:${WEB_HOST_PORT:-3300}:3000'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    image: spotkick-api:portfolio
    network_mode: service:redis
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://spotkick:${POSTGRES_PASSWORD:?Set a database password}@127.0.0.1:5432/spotkick
      REDIS_URL: redis://127.0.0.1:6379
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the HTTPS web origin}
      BOT_AFTER_MS: ${BOT_AFTER_MS:-5000}
      CHOICE_MS: ${CHOICE_MS:-10000}
      REVEAL_MS: ${REVEAL_MS:-3000}
      RESULT_MS: ${RESULT_MS:-1600}
      RAKE_BPS: ${RAKE_BPS:-300}
      GUEST_RATE_LIMIT: ${GUEST_RATE_LIMIT:-30}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
  web:
    image: spotkick-web:portfolio
    network_mode: service:redis
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
