# Local portfolio acceptance only. Requires Compose 2.24.4+ for !override.
# Run with compose.yaml, under a separate COMPOSE_PROJECT_NAME.
services:
  api:
    ports: !override
      - '127.0.0.1:3101:3001'
    environment:
      WEB_ORIGIN: ${SPOTKICK_WEB_ORIGIN:-http://127.0.0.1:3180}
      GUEST_RATE_LIMIT: '2000'
  web:
    ports: !override
      - '127.0.0.1:${SPOTKICK_WEB_PORT:-3180}:3000'
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3101
  api2:
    profiles: [load]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://spotkick:spotkick@postgres:5432/spotkick
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${SPOTKICK_WEB_ORIGIN:-http://127.0.0.1:3180}
      BOT_AFTER_MS: ${BOT_AFTER_MS:-5000}
      RAKE_BPS: ${RAKE_BPS:-300}
      CHOICE_MS: ${CHOICE_MS:-10000}
      REVEAL_MS: ${REVEAL_MS:-3000}
      RESULT_MS: ${RESULT_MS:-1600}
      GUEST_RATE_LIMIT: '2000'
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '127.0.0.1:3102:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
